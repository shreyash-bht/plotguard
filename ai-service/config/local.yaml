database:
  url: ${DATABASE_URL:postgresql://postgres:admin@localhost:5432/postgres}

ollama:
  base_url: ${OLLAMA_BASE_URL:http://localhost:11434}

embedding:
  model: ${EMBEDDING_MODEL:qwen3-embedding:0.6B}
  interval_seconds: ${EMBEDDING_INTERVAL_SECONDS:30}

chat_llm:
  provider: ${CHAT_LLM_PROVIDER:gemini}

  gemini:
    model: ${GEMINI_LLM_MODEL:gemini-3.5-flash-lite}
    api_key: ${GEMINI_API_KEY}

  ollama:
    model: ${OLLAMA_CHAT_LLM_MODEL:qwen2.5:3b}

contextualizer:
  provider: ${CONTEXTUALIZER_PROVIDER:ollama}

  gemini:
    model: ${GEMINI_LLM_MODEL:gemini-3.6-flash-lite}
    api_key: ${GEMINI_API_KEY}

  ollama:
    model: ${OLLAMA_CONTEXTUALIZER_MODEL:qwen2.5:1.5b}

retrieval:
  enable_reranking: ${ENABLE_RERANKING:true}